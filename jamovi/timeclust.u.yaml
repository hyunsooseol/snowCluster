title: Time Series Clustering
name: timeclust
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: time
        children:
          - type: VariablesListBox
            name: feature
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: item
        children:
          - type: VariablesListBox
            name: item
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: value
        children:
          - type: VariablesListBox
            name: value
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: 'Analysis'
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: 'Clustering options'
                children:
                  - type: TextBox
                    name: k
                    format: number
                  - type: CheckBox
                    name: standardize
              - type: Label
                label: 'Cluster information'
                children:
                  - type: CheckBox
                    name: plot1
                  - type: CheckBox
                    name: silhouette
              - type: Label
                label: 'Results'
                children:
                  - type: Output
                    name: clust
                  - type: CheckBox
                    name: summary
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            cell:
              column: 1
              row: 0
            fitToGrid: true
            children:
              - type: Label
                label: 'Plots'
                children:
                  - type: TextBox
                    name: angle
                    format: number
                    suggestedValues:
                      - value: 0
                      - value: 45
                      - value: 90
                  - type: CheckBox
                    name: plot
                  - type: CheckBox
                    name: plot3
                  - type: CheckBox
                    name: silhouettePlot