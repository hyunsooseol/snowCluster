title: Linear Discriminant Analysis
name: disc
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: dep
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Covariates
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
  - type: CollapseBox
    label: 'Linear Discriminant'
    margin: large
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: 'Tables'
                children:
                  - type: CheckBox
                    name: prior
                  - type: CheckBox
                    name: gm
                  - type: CheckBox
                    name: coef
                  - type: CheckBox
                    name: nl
                  - type: CheckBox
                    name: prop
                  - type: CheckBox
                    name: gc
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            cell:
              column: 1
              row: 0
            fitToGrid: true
            children:
              - type: Label
                label: Confusion matrix
                children:
                  - type: CheckBox
                    name: tra
                    children:
                      - type: TextBox
                        name: per
                        enable: (tra)
                        format: number
                  - type: CheckBox
                    name: tes
              - type: Label
                label: Save
                children: 
                  - type: Output
                    name: scores
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            cell:
              column: 0
              row: 1
            stretchFactor: 1
            children:
              - type: Label
                label: Plots
                children:
                  - type: CheckBox
                    name: plot
                  - type: CheckBox
                    name: plot1
  - type: CollapseBox
    label: 'Discriminant Function Statistics'
    margin: large
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: 'Tables'
                children:
                  - type: CheckBox
                    name: can
                    label: Canonical discriminant functions
                  - type: CheckBox
                    name: struct
                    label: Structure coefficients    
                  - type: CheckBox
                    name: wilks
                    label: Wilks' Lambda tests