---
name:  disc
title: Linear Discriminant Analysis
jrs:   '1.1'
refs: snowCluster
items:
    - name: instructions
      title: Instructions
      type: Html
      visible: True

    - name:  text
      title: ' '
      type:  Preformatted
      
    - name: prior
      title: 'Prior probability of groups'
      type: Table
      visible: (prior)
      clearWith:
        - covs
        - dep
        - per
      
      columns:
        - name: name
          title: ''
          type: 'text'
          content: ($key)

        - name: value
          title: 'Value'
             
    - name: gm
      title: 'Group means'
      type: Table
      visible: (gm)
      clearWith:
        - covs
        - dep
        - per
 
      columns:
        - name: name
          title: ''
          type: 'text'
          content: ($key)

    - name: coef
      title: 'Coefficients of linear discriminants'
      type: Table
      refs: MASS
      visible: (coef)
      clearWith:
        - covs
        - dep
        - per

      columns:
        - name: name
          title: ''
          type: 'text'
          content: ($key)
       
    - name: nl
      title: 'Normalized loadings'
      type: Table
      refs: MASS
      visible: (nl)
      clearWith:
        - covs
        - dep
        - per

      columns:
        - name: name
          title: ''
          type: 'text'
          content: ($key)

    - name: prop
      title: 'Proportion of trace'
      type: Table
      visible: (prop)
      rows: 1
      clearWith:
        - covs
        - dep 
        - per

      columns:
        - name: name
          title: ''
          type: 'text'
          content: Proportion(%)
        - name: LD1
          type: number
        - name: LD2
          type: number

    - name: tra
      title: 'Confusion matrix with training set'
      type: Table
      visible: (tra)
      clearWith:
        - covs
        - dep
        - per
     
      columns:
        - name: name
          title: ''
          type: 'text'
          content: ($key)
 
    - name: tes
      title: 'Confusion matrix with test set'
      type: Table
      visible: (tes)
      clearWith:
        - covs 
        - dep
        - per
        
      columns:
        - name: name
          title: ''
          type: 'text'
          content: ($key)

    - name:  plot
      title: 'Linear discriminant plot'
      type:  Image
      requiresData: true
      visible: (plot)
      renderFun: .plot
      clearWith:
        - covs 
        - dep
        - per
        - gc

    - name: gc
      title: 'Group centroids'
      type: Table
      refs: MASS
      visible: (gc)
      clearWith:
        - covs
        - dep
        - per

      columns:
        - name: name
          title: 'Groups'
          type: 'text'
          content: ($key)

        - name: ld1
          title: 'LD1'
          type: number
          
        - name: ld2
          title: 'LD2'
          type: number      

    - name:  plot1
      title: Histogram
      type:  Image
      requiresData: true
      visible: (plot1)
      renderFun: .plot1
      clearWith:
        - covs 
        - dep
        - per

    - name: scores
      title: 'Discriminant scores'
      type: Output
      clearWith:
        - covs
        - dep
        - per


    - name: can
      title: Canonical Discriminant Functions
      type: Table
      visible: (can)
      clearWith:
        - dep
        - covs
        - per
      rows: 0
      columns:
        - name: function
          title: Function
          type: text

        - name: eigen
          title: Eigenvalue
          type: number
          format: zto

        - name: variance
          title: '% of Variance'
          type: number
          format: zto

        - name: cumulative
          title: Cumulative %
          type: number
          format: zto

        - name: canonical
          title: Canonical Correlation
          type: number
          format: zto

    - name: struct
      title: Structure Coefficients
      type: Table
      visible: (struct)
      clearWith:
        - dep
        - covs
        - per
      rows: 0
      columns:
        - name: variable
          title: Variable
          type: text

    - name: wilks
      title: Wilks' Lambda Tests
      type: Table
      visible: (wilks)
      clearWith:
        - dep
        - covs
        - per
      rows: 0
      columns:
        - name: test
          title: Test of Function(s)
          type: text

        - name: lambda
          title: Wilks' Lambda
          type: number
          format: zto

        - name: chisq
          title: Chi-square
          type: number
          format: zto

        - name: df
          title: df
          type: integer

        - name: p
          title: p
          type: number
          format: zto,pvalue
...
