---
name:  hc
title: Clustering Dendrogram
jrs:   '1.1'
refs: snowCluster
items:
    - name: instructions
      title: Instructions
      type: Html
      visible: True  

    - name: progressBarHTML
      title: ' '
      type: Html
      visible: false

    - name: clust
      title: Clustering
      type: Output
      varTitle: Clustering
      measureType: nominal
      clearWith:
        - vars
        - labels
        - k
        - stand
        - metric
        - type
        - method
        - mode

    - name:  plot
      title: Cluster Dendrogram
      type:  Image
      width: 600
      height: 450      
      requiresData: true
      refs: factoextra
      visible: (plot)
      renderFun: .plot
      clearWith:
        - vars
        - labels
        - k
        - stand
        - metric
        - type
        - method
        - horiz
        - mode

    - name:  plot1
      title: 'Cluster Dendrogram with p-values'
      type:  Image
      width: 600
      height: 450      
      requiresData: true
      refs: pvclust
      visible: (plot1)
      renderFun: .plot1
      clearWith:
        - vars1
        - nb
        - method1
        - dm
        - mode

    # - name:  text
    #   title: 'Cluster Information' 
    #   type:  Preformatted
    #   visible: (plot1)     

    - name: clusterInfo
      title: Cluster Information
      type: Table
      visible: (plot1)
      clearWith:
        - vars1
        - nb
        - method1
        - dm
        - mode
      columns:
        - name: cluster
          title: Cluster
          type: integer
        - name: size
          title: Size
          type: integer
        - name: members
          title: Members
          type: text
...
