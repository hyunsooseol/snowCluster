---
name:  roc
title: ROC Analysis
menuGroup: snowCluster
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: dep
      title: 'Dependent variable'
      type: Variable
      suggested:
        - nominal
      permitted:
        - factor

    - name: covs
      title: 'Covariates'
      type: Variables

    - name: plot1
      title: 'ROC curve'
      type: Bool
      default: FALSE

    - name: plot2
      title: 'Multiple ROC curves'
      type: Bool
      default: FALSE

    - name: plot3
      title: 'Faceted ROC plots'
      type: Bool
      default: FALSE

    - name: auc
      title: 'AUC test (Predictors > 1)'
      type: Bool
      default: FALSE

    - name: dif
      title: 'AUC difference'
      type: Bool
      default: FALSE

    - name: overall
      title: 'Overall test'
      type: Bool
      default: FALSE

    - name: positive
      title: 'Positive level'
      type: Level
      variable: (dep)

    - name: optimalCutpoint
      title: 'Optimal cutpoint (Youden index)'
      type: Bool
      default: FALSE

    - name: specifiedCutpoint
      title: 'Evaluate specified cutpoint (Predictors = 1)'
      type: Bool
      default: FALSE

    - name: cutpointValue
      title: 'Specified cutpoint'
      type: Number
      default: 0

    - name: classificationTable
      title: 'Classification table'
      type: Bool
      default: FALSE

...