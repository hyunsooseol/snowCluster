
title: ROC Analysis
name: roc
jus: '3.0'
stage: 0
compilerMode: tame

children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: 'Dependent'
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true

          - type: LevelSelector
            name: positive
            enable: (dep)

      - type: TargetLayoutBox
        label: 'Predictors'
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true

  - type: CollapseBox
    label: 'ROC analysis'
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: 'Plots'
                children:
                  - type: CheckBox
                    name: plot1
    
                  - type: CheckBox
                    name: plot2
    
                  - type: CheckBox
                    name: plot3
    
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            cell:
              column: 1
              row: 0
            fitToGrid: true
            children:
              - type: Label
                label: 'DeLong Test'
                children:
                  - type: CheckBox
                    name: auc
                    children:
                      - type: CheckBox
                        name: dif
                        enable: (auc)
    
                      - type: CheckBox
                        name: overall
                        enable: (auc)
    
  - type: CollapseBox
    label: 'Cutpoint Analysis'
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        cell:
          column: 0
          row: 1
        stretchFactor: 1
        children:
          - type: CheckBox
            name: optimalCutpoint
  
          - type: CheckBox
            name: specifiedCutpoint
            children:
              - type: TextBox
                name: cutpointValue
                format: number
                enable: (specifiedCutpoint)
  
          - type: CheckBox
            name: classificationTable